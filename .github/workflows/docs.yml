# The engine's docs site (docs/api), warnings as errors. One workflow per check, so each has its own
# README badge. It is published by the org site (paperboatlab.github.io), which builds every
# repository's docs with docs/site/build.py; this repository deploys nothing itself.
name: docs

on:
  push:
    branches: [dev, main]
  pull_request:
    paths:
      - "docs/**"
      - "protocol/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: API reference (Sphinx, warnings as errors)
    runs-on: ubuntu-24.04
    steps:
      # docs/gen_tokens.py reads the sibling paperboat-shared repo's tokens.css.
      - uses: actions/checkout@v4
        with:
          path: paperboat
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat-shared
          path: paperboat-shared
          token: ${{ secrets.DOWNSTREAM_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The docs' tokens are generated from the app's, and current
        run: python3 docs/gen_tokens.py --check
        working-directory: paperboat
      - run: pip install sphinx shibuya
      - run: python3 docs/site/build.py docs/api docs/api/_build
        working-directory: paperboat
      # The org site redeploys on this signal, so a docs change is live minutes after it lands.
      - name: Tell the org site
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && env.TOKEN != ''
        env:
          TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
          GH_TOKEN: ${{ secrets.DOWNSTREAM_TOKEN }}
        run: gh api repos/paperboatlab/paperboatlab.github.io/dispatches -f event_type=docs
