# Build, scan, sign and publish one runtime image. Reusable: any paperboatlab repository with a
# Containerfile calls it (`uses: paperboatlab/paperboat/.github/workflows/runtime-image.yml@main`).
# Pushes only from main of paperboatlab repositories; a pull request builds and scans without pushing.
name: runtime-image
on:
  workflow_call:
    inputs:
      name:      { type: string, required: true }   # julia -> ghcr.io/paperboatlab/paperboat-runtime-julia
      version:   { type: string, required: true }
      revision:  { type: string, required: true }
      base:      { type: string, required: true }   # the upstream image, pinned by digest
      file:      { type: string, default: images/Containerfile }
      platforms: { type: string, default: "linux/amd64,linux/arm64" }
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to ghcr
      id-token: write       # cosign keyless (GitHub OIDC)
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/paperboatlab/paperboat-runtime-${{ inputs.name }}
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository_owner == 'paperboatlab' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan the base for this host (fails on fixable critical issues)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.base }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ inputs.name }}
          path: trivy.sarif
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ env.PUSH == 'true' }}
          provenance: mode=max       # SLSA provenance attestation
          sbom: true                 # SPDX SBOM attestation
          build-args: |
            BASE=${{ inputs.base }}
            RUNTIME=${{ inputs.name }}
            VERSION=${{ inputs.version }}
            REVISION=${{ inputs.revision }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}-r${{ inputs.revision }}
            ${{ env.IMAGE }}:${{ inputs.version }}
      - if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Sign by digest (keyless)
        if: env.PUSH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: echo "${IMAGE}:${{ inputs.version }}-r${{ inputs.revision }} -> ${{ steps.build.outputs.digest }} (pushed=${PUSH})" >> "$GITHUB_STEP_SUMMARY"
