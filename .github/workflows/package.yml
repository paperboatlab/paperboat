# Packages: rpm (x86_64) and a macOS .pkg (arm64). Every push builds and tests them; a v* tag
# attaches them to the GitHub release. deb and Windows: see the issues labelled `packaging`.
#   paperboat-cli   paperboat, paperboatd, runtimes, registries; Requires paperboat-devel
#   paperboat-devel headers, libpaperboat_runtime.a, find_package(paperboat)
#   paperboat-launcher the Launcher (electron-builder, apps/launcher/electron-builder.cjs); Requires paperboat-cli
name: package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # the release upload

jobs:
  rpm-x64:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - run: dnf -y install git cmake ninja-build gcc-c++ rpm-build nodejs npm
      - uses: actions/checkout@v4
      - run: npm ci && npm run build -w @paperboat/cli
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAPERBOAT_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
      - run: ninja -C build
      - run: cd build && cpack -G RPM
      - name: install and use
        run: |
          dnf -y install build/paperboat-cli-*.rpm build/paperboat-devel-*.rpm
          paperboat help >/dev/null && paperboat toolkits
          test -f /usr/share/paperboat/cli/main.js
          mkdir -p /tmp/c && cd /tmp/c
          printf 'cmake_minimum_required(VERSION 3.25)\nproject(c CXX)\nset(CMAKE_CXX_STANDARD 20)\nfind_package(paperboat REQUIRED)\nadd_executable(c c.cpp)\ntarget_link_libraries(c PRIVATE paperboat::runtime)\n' > CMakeLists.txt
          printf '#include <paperboat/paths.hpp>\n#include <iostream>\nint main() { std::cout << paperboat::paths::control_socket() << "\\n"; }\n' > c.cpp
          cmake -S . -B b -G Ninja && ninja -C b && ./b/c
      - uses: actions/upload-artifact@v4
        with: { name: rpm-x64, path: build/*.rpm }

  rpm-launcher-x64:
    needs: rpm-x64  # the install check installs the CLI rpm first (Requires: paperboat-cli)
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - run: dnf -y install git nodejs npm rpm-build libxcrypt-compat util-linux  # libcrypt.so.1 for electron-builder's fpm; runuser
      - uses: actions/checkout@v4
      - run: npm ci && npm run build -w @paperboat/launcher
      - name: package
        run: |
          v=$(node -p 'require("./apps/launcher/package.json").version')
          case $GITHUB_REF in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; esac  # a beta tag: 0.2.0~beta.1
          npm run package -w @paperboat/launcher -- -c.extraMetadata.version=$v
      - uses: actions/download-artifact@v4
        with: { name: rpm-x64, path: cli }
      - name: install and start
        run: |
          dnf -y install cli/paperboat-cli-*.rpm cli/paperboat-devel-*.rpm apps/launcher/release/paperboat-launcher-*.rpm
          rpm -q --requires paperboat-launcher | grep -qx paperboat-cli
          test -f /usr/share/applications/paperboat-launcher.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/paperboat-launcher.png
          runuser -u nobody -- paperboat-launcher --version  # main.cjs loads from the asar; not as root (Chromium refuses)
      - uses: actions/upload-artifact@v4
        with: { name: rpm-launcher-x64, path: apps/launcher/release/*.rpm }

  macos-arm:
    runs-on: macos-15  # Xcode 16.3+: libc++ with std::jthread
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: npm ci && npm run build -w @paperboat/cli
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
      - run: ninja -C build
      - run: ./build/tests/paperboat_tests && ./build/tests/paperboat_cli_tests
      - run: cd build && cpack -G productbuild
      - name: install and use
        run: |
          sudo installer -pkg build/paperboat-*.pkg -target /
          pkgutil --files org.paperboatlab.paperboat.cli | head -5 || true
          /usr/local/bin/paperboat help >/dev/null && /usr/local/bin/paperboat toolkits
      - uses: actions/upload-artifact@v4
        with: { name: macos-arm64, path: build/*.pkg }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rpm-x64, rpm-launcher-x64, macos-arm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
