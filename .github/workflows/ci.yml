name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 podman
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14
      - run: ninja -C build
      - run: ./build/tests/paperboat_tests
      - name: container tests (rootless podman)
        run: ./build/tests/paperboat_container_tests
      - run: ./build/tests/paperboat_cli_tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: client (typecheck, tests with the contract against build/paperboat)
        run: npm run typecheck -w @paperboat/client && npm test -w @paperboat/client
