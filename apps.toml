# The app registry: the apps `paperboat app install <app>` can install, added as each is rebuilt on
# this platform (Simplicial and Articula follow Malachite and Julix).
#
#   name         what you type: app install malachite
#   label        how the Launcher and the TUI show it
#   repo         its GitHub repository: a release carries `<name>-<version>.tar.gz` (one top folder),
#                unpacked to <home>/apps/<name>; `app install <name> --from <folder>` links a checkout
#   description  one line
#   runtimes     pulled at install (paperboatd would pull them when first used anyway)
#   launch       the app server, run as `<launch> <folder> --port <port>` by `app open`; ready when it
#                listens on 127.0.0.1:<port>
#   port         its first port; the next free one for each further folder
#   commands     words it adds: before it is installed, `paperboat <word>` says to install it

[[apps]]
name        = "malachite"
label       = "Malachite"
repo        = "https://github.com/paperboatlab/malachite"
description = "Engineering notebook in Julia and Python"
runtimes    = ["julia@1.11", "python@3.12"]
launch      = "bin/malachite"
port        = 59210
commands    = []

[[apps]]
name        = "julix"
label       = "Julix"
repo        = "https://github.com/paperboatlab/julix"
description = "Julia workbench: scripts, a console, variables and figures"
runtimes    = ["julia@1.11"]
launch      = "bin/julix"
port        = 59220
commands    = []

[[apps]]
name        = "articula"
label       = "Articula"
repo        = "https://github.com/paperboatlab/articula"
description = "Acausal modelling: an OpenModelica editor"
runtimes    = ["omc@1.27"]
launch      = "bin/articula"
port        = 59240
commands    = []
