# The toolkit registry: Simplicial's toolkits, each its own repository (simplicial-toolkit-<name>).
# `paperboat toolkit install <name>` builds one as a plugin against Simplicial's SDK, so the toolkit
# commands need Simplicial installed. kind: base (every station has it) or optional.

[[toolkits]]
name = "base"
kind = "base"
repo = "https://github.com/paperboatlab/simplicial-toolkit-base.git"
description = "The eight packages every station can use: base, signal, math, board, step, string, group and list."

[[toolkits]]
name = "control"
kind = "optional"
repo = "https://github.com/paperboatlab/simplicial-toolkit-control.git"
description = "Control blocks: pid, transfer functions, filters, nonlinear and discrete blocks, lqr, observers and kalman, and per-step mpc, lp_step, nmpc (needs optimization)."
needs = ["optimization"]

[[toolkits]]
name = "optimization"
kind = "optional"
repo = "https://github.com/paperboatlab/simplicial-toolkit-optimization.git"
description = "Linear, quadratic and nonlinear programming blocks (OSQP, Ipopt)."

[[toolkits]]
name = "opencv"
kind = "optional"
repo = "https://github.com/paperboatlab/simplicial-toolkit-opencv.git"
description = "Image processing blocks, view monitor, and image station object (OpenCV)."

[[toolkits]]
name = "meshop"
kind = "optional"
repo = "https://github.com/paperboatlab/simplicial-toolkit-meshop.git"
description = "Triangle mesh blocks on VCGlib (GPL-3.0): load, save, stats and a print check."
