appId: dev.paperboatlab.launcher
productName: Paperboat Launcher
copyright: Copyright © PaperboatLab (Apache-2.0)
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - public/favicon.svg
  - package.json
extraResources:
  - from: resources/paperboat
    to: paperboat
    filter:
      - "**/*"
fileAssociations:
  - ext: ppk
    name: Paperboat Backend Package
    role: Viewer
linux:
  target:
    - target: deb
      arch: x64
    - target: rpm
      arch: x64
  category: Development
  maintainer: "PaperboatLab <hello@paperboatlab.dev>"
  executableName: paperboat-launcher
  syncDesktopName: true
  artifactName: "paperboat-launcher-${version}-${arch}.${ext}"
  icon: build/icon.png
deb:
  packageName: paperboat-launcher
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
rpm:
  packageName: paperboat-launcher
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.developer-tools
  artifactName: "Paperboat-Launcher-${version}-${arch}.${ext}"
  icon: build/icon.png
dmg:
  title: "Paperboat Launcher ${version}"
win:
  target:
    - target: msi
      arch: x64
  artifactName: "Paperboat-Launcher-${version}-${arch}.${ext}"
  icon: build/icon.png
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Paperboat Launcher
