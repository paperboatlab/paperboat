# Julia 1.11. The image holds the toolchain only; a project's packages live in its deps volume
# (/work/deps, first on JULIA_DEPOT_PATH; the trailing ":" keeps the image's own depot behind it).
# session and station speak paperboat-runtime/0 through lib/ (PaperboatRuntime.jl, stdlib only), which
# the daemon mounts at /opt/pb.
name     = "julia"
version  = "1.11.6"
protocol = "paperboat-runtime/0"
modes    = ["session", "station", "exec"]

[image]
ref    = "docker.io/library/julia:1.11.6-bookworm"  # until ghcr.io/paperboatlab/paperboat-runtime-julia (phase 1b)
digest = "sha256:1623eb4161dc20ee57bcf694e48cb16cfc2aed71507e79b2ff170a206ccd7803"  # the multi-arch index
arch   = ["amd64", "arm64"]

[entry]
session = ["julia", "--startup-file=no", "--threads=1", "{lib}/serve.jl", "{ipc}/runtime.sock", "session"]
station = ["julia", "--startup-file=no", "--threads=2", "{lib}/serve.jl", "{ipc}/runtime.sock", "station"]

[env]
HOME             = "/tmp"
JULIA_DEPOT_PATH = "/work/deps:"

[limits]
memory = "4g"
cpus   = 2
pids   = 512

[capabilities]
transports    = ["shm", "uds", "stdio"]
granularities = ["step", "segment", "subgraph", "block"]

[native]
requires = "julia"
entry.session = ["julia", "--startup-file=no", "--threads=1", "{lib}/serve.jl", "{ipc}/runtime.sock", "session"]
entry.station = ["julia", "--startup-file=no", "--threads=2", "{lib}/serve.jl", "{ipc}/runtime.sock", "station"]

[healthcheck]
hello_timeout = "60s"  # no sysimage yet: a first start compiles
