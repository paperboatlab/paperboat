# OpenModelica's compiler. exec only for now: omc's interactive server listens on TCP (ZMQ), which a
# --network=none container cannot offer the host; Articula's session mode (phase 5) bridges it over the
# lease's Unix socket instead of opening the network.
name     = "omc"
version  = "1.27.1"
protocol = "omc-zmq"
modes    = ["exec"]

[image]
ref    = "docker.io/openmodelica/openmodelica:v1.27.1-minimal"  # until ghcr.io/paperboatlab/paperboat-runtime-omc
digest = "sha256:ac9a0223e69b8055d444b42f58ccb9680342b56848c68b81385bf83d7c0ba824"  # the multi-arch index
arch   = ["amd64", "arm64"]

[env]
HOME = "/tmp"
USER = "omc"

[limits]
memory = "8g"
cpus   = 4
pids   = 1024

[native]
requires = "omc"
